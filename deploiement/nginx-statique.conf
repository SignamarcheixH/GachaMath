# Fichiers servis directement par nginx.
#
# À copier vers /etc/nginx/snippets/gachamath-statique.conf, puis à inclure
# depuis le bloc « server » qui écoute en 443 — celui que Certbot a écrit.
# Passer par un fichier séparé évite d'écraser sa configuration TLS, et
# survivra à ses prochains passages.
#
# POURQUOI : sans cela, nginx transmet TOUT à Django, y compris le CSS et les
# douze fichiers JavaScript. Un chargement de page coûte 14 requêtes, et
# gunicorn n'en traite que trois à la fois. Un navigateur en ouvrant six en
# parallèle, un seul visiteur sature déjà la capacité. Servis ici, ces
# fichiers ne touchent plus l'application du tout.
#
# Les chemins sont énumérés un par un, jamais un « root » attrapant tout :
# le dossier contient aussi .env et la base de données. Une règle trop large
# les rendrait téléchargeables par n'importe qui.

# ---------- refus explicite des fichiers cachés ----------
# L'exception .well-known n'est pas décorative : c'est par là que Certbot
# renouvelle le certificat. La bloquer casserait le site dans soixante jours,
# sans le moindre avertissement d'ici là.
location ~ /\.(?!well-known) {
    deny all;
}

# ---------- l'accueil ----------
location = / {
    root /srv/gachamath;
    try_files /index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=3600" always;
}

# ---------- la page de développement ----------
# `design.html` est le système de design : il ne sert qu'à l'auteur, en local.
# Son script refuse déjà de s'assembler hors localhost — la page affiche un mot
# et rien d'autre — mais l'adresse répondait quand même, et une URL qui répond
# finit par être trouvée. On la refuse ici : la garde du script devient la
# seconde ligne de défense au lieu d'être la seule.
#
# `location =` est une correspondance EXACTE : nginx la choisit avant toute
# expression régulière, quel que soit l'ordre dans le fichier. Ce bloc l'emporte
# donc sur la règle des pages ci-dessous.
location = /design.html {
    return 404;
}

# ---------- les pages ----------
# Le HTML n'est jamais mis en cache : il porte les numéros de version de tous
# les autres fichiers, donc s'il est périmé, tout l'est.
location ~ ^/[a-z0-9-]+\.html$ {
    root /srv/gachamath;
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=3600" always;
}

# ---------- CSS et JavaScript ----------
# Demandés avec « ?v=N » : une URL versionnée désigne un contenu qui ne
# changera plus, on la garde un an.
location ~ ^/(css|js)/ {
    root /srv/gachamath;
    add_header Cache-Control "public, max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;                 # et le disque ne se remplit pas pour rien

    # La compression est déclarée ici, dans le « location », et non au premier
    # niveau du fichier. Ce fichier étant inclus dans un bloc « server », toute
    # directive de premier niveau atterrit dans ce contexte — où « gzip » peut
    # déjà exister, et nginx refuse alors de démarrer sur un doublon. Un
    # fichier destiné à être inclus ne doit rien poser au niveau de son hôte.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# ---------- images du jeu ----------
# Sans ce bloc, /images/ tomberait dans le refus par défaut : l'allowlist ne
# couvrait que le HTML, css/ et js/. Les vignettes de la carte ne s'afficheraient
# pas en production, alors qu'elles marchent en développement — le serveur de
# développement, lui, sert la racine.
#
# Pas de gzip ici : WebP est déjà compressé, le repasser à la moulinette coûte
# du processeur pour rien.
location ~ ^/images/ {
    root /srv/gachamath;
    add_header Cache-Control "public, max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
}

# ---------- fichiers de service ----------
location ~ ^/(robots\.txt|sitemap\.xml|ads\.txt)$ {
    root /srv/gachamath;
    add_header Cache-Control "public, max-age=3600" always;
}

# ---------- habillage de l'administration Django ----------
location /statique/ {
    alias /srv/gachamath/serveur/statique/;
    add_header Cache-Control "public, max-age=31536000" always;
    access_log off;
}
