# /etc/nginx/sites-available/gachamath
#
# Ce fichier ne contient QUE le HTTP. C'est volontaire : on le pose tel quel,
# on vérifie que le site répond, puis « certbot --nginx » ajoute lui-même le
# bloc TLS et la redirection permanente. Écrire la configuration TLS à la main
# avant d'avoir le certificat donne un nginx qui refuse de démarrer, et un
# serveur muet est le pire moment pour découvrir une faute de frappe.

server {
    listen 80;
    listen [::]:80;
    server_name gachamath.fr www.gachamath.fr;

    # Mesuré, pas estimé : une sauvegarde pèse ~43 octets par nombre possédé,
    # soit 4,1 Mo pour la collection complète (0 à 99 999). La marge va
    # jusqu'à 16 Mo pour que ce soit toujours l'application qui refuse, avec
    # son message en français, plutôt que nginx avec une page d'erreur brute.
    client_max_body_size 16m;

    # Les réponses de l'API sont du JSON, parfois volumineux : le classement
    # et la relecture d'une partie complète. Les fichiers du jeu sont déjà
    # compressés par WhiteNoise, d'où l'absence de text/html ici.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Indispensable : sans cet en-tête, Django ne sait pas que la
        # connexion d'origine était en HTTPS et sa redirection vers HTTPS
        # tourne en boucle infinie.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Une partie complète fait plusieurs mégaoctets : le défaut de 60 s
        # suffit largement, mais on l'écrit pour que ce soit un choix.
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # Journaux : la page de confidentialité annonce trente jours. La rotation
    # par défaut de Debian en garde quatorze, ce qui respecte l'engagement.
    access_log /var/log/nginx/gachamath.access.log;
    error_log  /var/log/nginx/gachamath.error.log;
}
